<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartTrip CR · Panel de Administración</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>

<body>

  <nav class="navbar navbar-dark st-navbar mb-3">
    <div class="container-fluid px-4">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <i class="bi bi-signpost-split-fill fs-4"></i>
        <span>SmartTrip <span class="text-warning">CR</span></span>
      </span>

      <span class="navbar-text small d-none d-md-inline">
        Panel de administración
      </span>
    </div>
  </nav>

  <!-- Barra de estadísticas -->
  <div class="container-fluid px-4">
    <div class="row g-2 mb-3" id="stats-bar">
      <!-- Generado dinámicamente -->
    </div>
  </div>

  <div class="container-fluid px-4 pb-5">
    <div class="row g-4">

      <!-- Módulos -->
      <div class="col-lg-2">
        <div class="card shadow-sm st-card">

          <div
            class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center"
          >
            <span>
              <i class="bi bi-list-ul me-1"></i>
              Módulos
            </span>

            <div
              class="spinner-border spinner-border-sm text-secondary d-none"
              id="nav-loading"
              role="status"
            ></div>
          </div>

          <div
            class="list-group list-group-flush"
            id="nav-modulos"
            aria-label="Navegación entre módulos"
          ></div>

        </div>
      </div>

      <!-- Formulario -->
      <div class="col-lg-4">
        <div class="card shadow-sm st-card">
          <div class="card-body">

            <h2 class="h5 card-title mb-3" id="form-title">
              <i class="bi bi-plus-circle me-1"></i>
              Agregar registro
            </h2>

            <form id="dynamic-form" novalidate>

              <input type="hidden" id="registro-id" />

              <div id="form-fields">
                <!-- Campos generados dinámicamente -->
              </div>

              <div class="d-flex gap-2 mt-2">

                <button
                  type="submit"
                  class="btn st-btn-primary flex-fill"
                  id="submit-btn"
                >
                  <i class="bi bi-save2 me-1"></i>
                  Guardar
                </button>

                <button
                  type="button"
                  class="btn btn-outline-secondary d-none"
                  id="cancel-btn"
                >
                  Cancelar
                </button>

              </div>
            </form>

          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="col-lg-6">
        <div class="card shadow-sm st-card">
          <div class="card-body">

            <div
              class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2"
            >

              <h2 class="h5 card-title mb-0">
                <i
                  class="bi bi-collection-fill me-1"
                  id="modulo-icono"
                ></i>

                <span id="modulo-titulo">
                  Módulo
                </span>
              </h2>

              <div class="d-flex gap-2">

                <!-- Buscador -->
                <div
                  class="input-group input-group-sm"
                  style="width: 220px"
                >
                  <span class="input-group-text">
                    <i class="bi bi-search"></i>
                  </span>

                  <input
                    type="text"
                    class="form-control"
                    id="buscador"
                    placeholder="Buscar..."
                    aria-label="Buscar en la tabla"
                  />
                </div>

                <!-- Actualizar -->
                <button
                  class="btn btn-sm btn-outline-secondary"
                  id="refresh-btn"
                  aria-label="Actualizar tabla"
                >
                  <i class="bi bi-arrow-clockwise"></i>
                </button>

              </div>
            </div>

            <!-- Se conserva porque el JS de tus compañeros puede utilizarlo -->
            <div id="alert-box"></div>

            <div class="table-responsive">

              <table class="table table-hover align-middle">

                <thead id="table-head"></thead>

                <tbody id="table-body">

                  <tr>
                    <td class="text-center text-muted py-4">

                      <div
                        class="spinner-border spinner-border-sm me-2"
                        role="status"
                      ></div>

                      Cargando...

                    </td>
                  </tr>

                </tbody>

              </table>

            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal para eliminar -->
  <div
    class="modal fade"
    id="deleteModal"
    tabindex="-1"
    aria-hidden="true"
  >

    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            <i
              class="bi bi-exclamation-triangle-fill text-warning me-1"
            ></i>
            Confirmar eliminación
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>

        </div>

        <div class="modal-body">
          ¿Seguro que desea eliminar
          <strong id="delete-target-label"></strong>?
          Esta acción no se puede deshacer.
        </div>

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-outline-secondary"
            data-bs-dismiss="modal"
          >
            Cancelar
          </button>

          <button
            type="button"
            class="btn btn-danger"
            id="confirm-delete-btn"
          >
            Eliminar
          </button>

        </div>

      </div>
    </div>
  </div>

  <!-- Notificaciones -->
  <div
    class="toast-container position-fixed bottom-0 end-0 p-3"
    id="toast-container"
    style="z-index: 1080"
  ></div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <script src="js/modules.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
